[project]
name = "bookcraft"
version = "1.1.0"
description = "A PDF book generator for structured ritual and ceremonial texts"
authors = [{name = "Albert Artur Kolozsvari", email = "albertartk@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fpdf2>=2.8.5",
    "pydantic>=2.0",
    "PyYAML>=6.0.2",
    "typing-extensions>=4.15.0",
]

[project.scripts]
bookcraft = "bookcraft.cli:main"
test = "pytest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ty>=0.0.39",
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
addopts = "--cov=bookcraft --cov-report=term-missing --cov-report=xml"

[tool.hatch.build.targets.wheel]
packages = ["src/bookcraft"]
