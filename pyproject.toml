[project]
name = "bookcraft"
version = "0.1.0"
description = "A PDF book generator for structured ritual and ceremonial texts"
authors = [{name = "Albert Kolozsvari", email = "albertartk@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fpdf2>=2.8.5",
    "pydantic>=2.0",
    "PyYAML>=6.0.2",
    "typing-extensions>=4.15.0",
]

[project.scripts]
bookcraft = "bookcraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookcraft"]
